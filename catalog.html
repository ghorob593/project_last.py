<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VOLT — каталог електроніки">
    <title>VOLT — Каталог</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <span class="logo-main">VOLT</span>
                    <span class="logo-sub">tech store</span>
                </a>

                <nav class="main-nav" aria-label="Головна навігація">
                    <a href="index.html" class="nav-link">Головна</a>
                    <a href="catalog.html" class="nav-link active">Каталог</a>
                </nav>

                <button
                    type="button"
                    class="mobile-menu-button"
                    id="mobile-menu-button"
                    aria-label="Відкрити меню"
                    aria-expanded="false"
                >
                    <i class="bi bi-list"></i>
                </button>

                <div class="header-actions">
                    <a href="cart.html" class="header-icon" aria-label="Кошик">
                        <i class="bi bi-cart3"></i>
                        <span class="cart-counter">0</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="products-section">
        <div class="container">
            <div class="cart-page-heading">
                <div>
                    <p class="page-kicker">VOLT TECH STORE</p>
                    <h1>Каталог техніки</h1>
                </div>
            </div>

            <section class="search-section">
                <form class="search-form" id="search-form">
                    <div class="search-input-wrapper">
                        <i class="bi bi-search search-icon"></i>
                        <input
                            type="search"
                            id="search-input"
                            class="search-input"
                            placeholder="Пошук смартфона, ноутбука, бренду..."
                            autocomplete="off"
                        >
                    </div>
                    <button type="submit" class="search-button">Знайти</button>
                </form>
            </section>

            <div id="products-loading" class="products-loading">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Завантаження...</span>
                </div>
                <p>Завантаження товарів...</p>
            </div>

            <div id="products-error" class="products-error">
                <i class="bi bi-exclamation-circle"></i>
                <p>Не вдалося завантажити товари.</p>
                <button type="button" id="retry-button" class="retry-button">
                    Спробувати ще раз
                </button>
            </div>

            <div id="products-container" class="products-grid"></div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© 2026 VOLT tech store</p>
        </div>
    </footer>
</body>
</html>
