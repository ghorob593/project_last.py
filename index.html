<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="TechMarket — Техніка, яка випереджає час">

    <title>VOLT — магазин техніки</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">

<body>
    <header class="site-header">
        <div class="container">
            <div class="header-content">

                <a href="logo.png" class="logo">
                    VOLT<span>TECH STORE</span>
                </a>

                <nav class="main-nav">
                    <a href="index.html" class="nav-link active">
                        Головна
                    </a>

                    <a href="catalog.html" class="nav-link">
                        Каталог
                    </a>

                    <a href="#" class="nav-link">
                        Переваги
                    </a>

                    <a href="#" class="nav-link">
                        Про нас
                    </a>
                </nav>

                <div class="header-actions">

                    <a href="cart.html" class="header-icon" aria-label="Кошик">
                        <i class="bi bi-cart3"></i>
                        <span class="cart-counter">0</span>
                    </a>

                    <button
                        class="header-icon account-button"
                        aria-label="Профіль"
                        >
                        <i class="bi bi-person"></i>
                    </button>
                </div>

            </div>
        </div>

    <main>
        <section class="search-section">
            <div class="container">

                <form class="search-form" id="search-form">

                    <div class="search-input-wrapper">

                        <i class="bi bi-search search-icon"></i>

                        <input
                            type="search"
                            id="search-input"
                            class="search-input"
                            placeholder="Пошук товарів, брендів..."
                            autocomplete="off"
                        >

                    </div>

                    <button type="submit" class="search-button">
